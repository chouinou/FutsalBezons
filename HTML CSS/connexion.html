<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Connexion | AS Bezons Futsal</title>
    <link rel="icon" href="assets/bezons-futsal-ball.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="guest-page">
    <a class="skip-link" href="#contenu">Aller au contenu</a>
    <header class="site-header">
        <div class="container header-inner">
            <a class="brand" href="index.html">
                <img src="assets/bezons-futsal-ball.svg" alt="" width="36" height="36">
                <span>AS Bezons Futsal</span>
            </a>
            <details class="site-menu">
                <summary aria-label="Menu">
                    <span class="menu-icon" aria-hidden="true"><span></span></span>
                </summary>
                <nav class="menu-panel" aria-label="Autres pages">
                    <a href="index.html">Accueil</a>
                    <a href="connexion.html" aria-current="page">Se connecter</a>
                    <a href="inscription.html">Créer un compte</a>
                </nav>
            </details>
        </div>
    </header>

    <main id="contenu" class="container page app-page" tabindex="-1">
        <div class="login-layout stack">
            <header class="login-title stack stack--tight">
                <div class="login-mark"><img class="icon" src="assets/login-ball.svg" alt="" width="18" height="18"></div>
                <h1>AS Bezons Futsal</h1>
                <p class="muted">Espace adhérents et gestion du club</p>
            </header>
            <form class="card app-card stack" method="post">
                <div class="well"><p class="icon-line small"><img class="icon" src="assets/match-flag.svg" alt="" width="18" height="18"><span>Prochain match · AS Bezons Futsal vs Cergy</span></p></div>
                <div class="field"><label for="email">Adresse e-mail</label><input id="email" name="email" type="email" autocomplete="username" placeholder="exemple@asbezons-futsal.fr" required></div>
                <div class="field"><label for="password">Mot de passe</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
                <label class="check-line"><input type="checkbox" name="_remember_me"> Se souvenir de moi</label>
                <button class="button button--full login-submit" type="submit" disabled>Se connecter <img class="icon" src="assets/arrow.svg" alt="" width="18" height="18"></button>
                <p class="login-bottom">Pas encore membre ? <a href="inscription.html">Créer un compte</a></p>
            </form>
            <p class="login-bottom"><a href="tableau-de-bord.html">Voir le tableau de bord de démonstration</a></p>
        </div>
    </main>
</body>
</html>
